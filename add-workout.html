<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrenman Ekle - FitTrack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .card {
      background: #18181b;
      border: 1px solid #3f3f46;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- ========== DINAMIK SIDEBAR ========== -->
  <div id="sidebar" class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col fixed h-screen"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content ml-72">
    <div class="max-w-3xl mx-auto px-6 py-10">
      <h1 class="text-4xl font-bold mb-2 flex items-center gap-3">
        <i class="fas fa-plus-circle text-emerald-500"></i> 
        Yeni Antrenman Ekle
      </h1>
      <p class="text-zinc-400 mb-10">Bugünkü performansını kaydet</p>

      <div class="card rounded-3xl p-8">
        <form id="workoutForm">
          <div class="grid grid-cols-2 gap-6">
            <div class="col-span-2 md:col-span-1">
              <label class="block text-sm text-zinc-400 mb-2">Antrenman Adı</label>
              <input type="text" id="workoutName" 
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500" 
                     placeholder="Örn: Göğüs ve Triceps" required>
            </div>
            <div class="col-span-2 md:col-span-1">
              <label class="block text-sm text-zinc-400 mb-2">Tarih</label>
              <input type="date" id="workoutDate" 
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500" required>
            </div>
          </div>

          <div class="mt-6">
            <label class="block text-sm text-zinc-400 mb-2">Süre (dakika)</label>
            <input type="number" id="duration" 
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-6 py-4 focus:outline-none focus:border-emerald-500" 
                   placeholder="65" required>
          </div>

          <div class="mt-8">
            <h3 class="text-lg font-semibold mb-4">Egzersizler</h3>
            <div id="exercises" class="space-y-4">
              <!-- Dinamik olarak eklenecek -->
            </div>
            <button type="button" onclick="addExercise()" 
                    class="mt-4 text-emerald-400 hover:text-emerald-300 flex items-center gap-2">
              <i class="fas fa-plus"></i> Yeni Egzersiz Ekle
            </button>
          </div>

          <div class="mt-10 flex gap-4">
            <button type="button" onclick="saveWorkout()" 
                    class="flex-1 bg-emerald-500 hover:bg-emerald-600 py-5 rounded-3xl font-semibold text-lg transition">
              Antrenmanı Kaydet
            </button>
            <a href="dashboard.html" 
               class="flex-1 border border-white/30 hover:bg-white/10 py-5 rounded-3xl font-semibold text-lg text-center transition">
              İptal
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let exerciseCount = 0;

    // ====================== DINAMIK SIDEBAR ======================
    function renderSidebar() {
      const isAdminUser = localStorage.getItem("isAdmin") === "true";
      
      const adminLink = isAdminUser ? `
        <a href="admin.html" class="nav-item mt-8 text-pink-400">
          <i class="fas fa-cogs"></i>
          <span>Admin Paneli</span>
        </a>` : '';

      document.getElementById('sidebar').innerHTML = `
        <div class="px-6 py-8">
          <div class="flex items-center gap-3 mb-10 pl-3">
            <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">💪</div>
            <h1 class="text-2xl font-bold text-white">FitTrack</h1>
          </div>
        </div>

        <nav class="space-y-1 px-3">
          <a href="dashboard.html" class="nav-item">
            <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
          </a>
          <a href="add-workout.html" class="nav-item active">
            <i class="fas fa-plus-circle"></i><span>Antrenman Ekle</span>
          </a>
          <a href="history.html" class="nav-item">
            <i class="fas fa-history"></i><span>Geçmiş</span>
          </a>
          <a href="nutrition.html" class="nav-item">
            <i class="fas fa-apple-alt"></i><span>Beslenme Takibi</span>
          </a>
          <a href="measurements.html" class="nav-item">
            <i class="fas fa-ruler-combined"></i><span>Ölçümler</span>
          </a>
          <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i><span>Profil</span>
          </a>
          ${adminLink}
        </nav>

        <div class="absolute bottom-8 w-full px-6">
          <button onclick="cikisYap()" 
                  class="w-full flex items-center justify-center gap-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 py-4 rounded-2xl transition font-medium">
            <i class="fas fa-sign-out-alt"></i>
            <span>Çıkış Yap</span>
          </button>
        </div>
      `;
    }

    function addExercise() {
      exerciseCount++;
      const exercisesDiv = document.getElementById('exercises');
      
      const exerciseHTML = `
        <div class="bg-zinc-800 p-6 rounded-2xl border border-white/10" id="ex-${exerciseCount}">
          <div class="flex justify-between items-center mb-4">
            <input type="text" placeholder="Egzersiz adı (Örn: Bench Press)" 
                   class="bg-transparent border-b border-white/30 focus:border-emerald-500 outline-none flex-1 text-lg">
            <button onclick="removeExercise(${exerciseCount})" class="text-red-400 hover:text-red-500 ml-4">
              <i class="fas fa-trash"></i>
            </button>
          </div>
          <div class="grid grid-cols-3 gap-4 text-sm">
            <div>
              <label class="text-zinc-400">Set</label>
              <input type="number" placeholder="4" class="w-full bg-zinc-700 rounded-xl px-4 py-3 mt-1">
            </div>
            <div>
              <label class="text-zinc-400">Tekrar</label>
              <input type="number" placeholder="10" class="w-full bg-zinc-700 rounded-xl px-4 py-3 mt-1">
            </div>
            <div>
              <label class="text-zinc-400">Ağırlık (kg)</label>
              <input type="number" placeholder="80" class="w-full bg-zinc-700 rounded-xl px-4 py-3 mt-1">
            </div>
          </div>
        </div>
      `;
      exercisesDiv.innerHTML += exerciseHTML;
    }

    function removeExercise(id) {
      const element = document.getElementById(`ex-${id}`);
      if (element) element.remove();
    }

    function saveWorkout() {
      const name = document.getElementById('workoutName').value.trim();
      if (!name) {
        alert("❌ Lütfen antrenman adını girin!");
        return;
      }

      const workout = {
        id: Date.now(),
        name: name,
        date: document.getElementById('workoutDate').value,
        duration: parseInt(document.getElementById('duration').value) || 60,
        timestamp: new Date().toISOString()
      };

      let workouts = JSON.parse(localStorage.getItem('workouts')) || [];
      workouts.unshift(workout);
      localStorage.setItem('workouts', JSON.stringify(workouts));

      alert("✅ Antrenman başarıyla kaydedildi!");
      window.location.href = "dashboard.html";
    }

    function cikisYap() {
      if (confirm("Çıkış yapmak istediğinden emin misin?")) {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("isAdmin");
        window.location.href = "index.html";
      }
    }

    window.onload = () => {
      renderSidebar();
      document.getElementById('workoutDate').valueAsDate = new Date();
      addExercise(); // İlk egzersizi otomatik ekle
    };
  </script>
</body>
</html>

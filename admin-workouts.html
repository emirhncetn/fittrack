<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrenman Yönetimi - FitTrack Admin</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">

  <div class="flex h-screen">
    <!-- Sidebar -->
    <div id="sidebar" class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col"></div>

    <div class="flex-1 overflow-auto">
      <div class="max-w-7xl mx-auto px-6 py-10">
        
        <!-- Header -->
        <div class="flex justify-between items-end mb-8">
          <div>
            <h1 class="text-4xl font-bold flex items-center gap-3">
              <i class="fas fa-dumbbell text-pink-500"></i> Antrenman Yönetimi
            </h1>
            <p class="text-zinc-400">Antrenmanlar, programlar ve içerik yönetimi</p>
          </div>
          
          <button onclick="openAddModal()" 
                  class="bg-pink-600 hover:bg-pink-500 px-6 py-3 rounded-2xl flex items-center gap-3 font-semibold transition">
            <i class="fas fa-plus"></i>
            Yeni Antrenman Ekle
          </button>
        </div>

        <!-- İstatistik Kartları -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
          <div class="bg-zinc-900 rounded-3xl p-6">
            <p class="text-zinc-400 text-sm">Toplam Antrenman</p>
            <p id="total-count" class="text-4xl font-bold mt-2">0</p>
          </div>
          <div class="bg-zinc-900 rounded-3xl p-6">
            <p class="text-zinc-400 text-sm">Aktif Antrenman</p>
            <p id="active-count" class="text-4xl font-bold mt-2 text-emerald-400">0</p>
          </div>
          <div class="bg-zinc-900 rounded-3xl p-6">
            <p class="text-zinc-400 text-sm">En Popüler</p>
            <p id="popular-category" class="text-4xl font-bold mt-2">—</p>
          </div>
          <div class="bg-zinc-900 rounded-3xl p-6">
            <p class="text-zinc-400 text-sm">Ortalama Süre</p>
            <p id="avg-duration" class="text-4xl font-bold mt-2">—</p>
          </div>
        </div>

        <!-- Arama ve Filtre -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
          <div class="flex-1 relative">
            <i class="fas fa-search absolute left-4 top-3.5 text-zinc-500"></i>
            <input id="searchInput" type="text" placeholder="Antrenman ara..." onkeyup="filterTable()" 
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-3 pl-11 pr-4 focus:outline-none focus:border-pink-500">
          </div>
          
          <select id="categoryFilter" onchange="filterTable()" 
                  class="bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-pink-500">
            <option value="">Tüm Kategoriler</option>
            <option value="Kuvvet">Kuvvet</option>
            <option value="HIIT">HIIT</option>
            <option value="Kardiyo">Kardiyo</option>
            <option value="Full Body">Full Body</option>
            <option value="Üst Vücut">Üst Vücut</option>
          </select>
        </div>

        <!-- Tablo -->
        <div class="bg-zinc-900 rounded-3xl overflow-hidden">
          <table class="w-full">
            <thead>
              <tr class="border-b border-zinc-800">
                <th onclick="sortTable(0)" class="text-left p-6 font-medium text-zinc-400 cursor-pointer hover:text-white">Antrenman Adı <i class="fas fa-sort"></i></th>
                <th onclick="sortTable(1)" class="text-left p-6 font-medium text-zinc-400 cursor-pointer hover:text-white">Kategori <i class="fas fa-sort"></i></th>
                <th onclick="sortTable(2)" class="text-left p-6 font-medium text-zinc-400 cursor-pointer hover:text-white">Süre <i class="fas fa-sort"></i></th>
                <th onclick="sortTable(3)" class="text-left p-6 font-medium text-zinc-400 cursor-pointer hover:text-white">Zorluk <i class="fas fa-sort"></i></th>
                <th class="text-left p-6 font-medium text-zinc-400">Egzersiz Sayısı</th>
                <th class="text-center p-6 font-medium text-zinc-400">Durum</th>
                <th class="text-center p-6 font-medium text-zinc-400">İşlemler</th>
              </tr>
            </thead>
            <tbody id="workoutTable" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Antrenman Modal (Egzersizli) -->
  <div id="workoutModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-zinc-900 rounded-3xl w-full max-w-3xl mx-4 max-h-[90vh] overflow-auto">
      <div class="p-8">
        <h2 id="modalTitle" class="text-2xl font-bold mb-6">Yeni Antrenman Ekle</h2>
        
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-6">
            <div class="col-span-2">
              <label class="block text-sm text-zinc-400 mb-2">Antrenman Adı *</label>
              <input id="name" type="text" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3 focus:outline-none focus:border-pink-500">
            </div>
            <div>
              <label class="block text-sm text-zinc-400 mb-2">Kategori</label>
              <select id="category" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3">
                <option value="Kuvvet">Kuvvet</option>
                <option value="HIIT">HIIT</option>
                <option value="Kardiyo">Kardiyo</option>
                <option value="Full Body">Full Body</option>
                <option value="Üst Vücut">Üst Vücut</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-zinc-400 mb-2">Süre (dk)</label>
              <input id="duration" type="number" value="45" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm text-zinc-400 mb-2">Zorluk</label>
              <select id="difficulty" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3">
                <option value="Başlangıç">Başlangıç</option>
                <option value="Orta" selected>Orta</option>
                <option value="İleri">İleri</option>
              </select>
            </div>
            <div>
              <label class="block text-sm text-zinc-400 mb-2">Durum</label>
              <select id="status" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-3">
                <option value="Aktif">Aktif</option>
                <option value="Pasif">Pasif</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm text-zinc-400 mb-2">Açıklama</label>
            <textarea id="description" rows="2" class="w-full bg-zinc-800 border border-zinc-700 rounded-3xl px-5 py-4"></textarea>
          </div>

          <!-- Egzersizler -->
          <div>
            <div class="flex justify-between items-center mb-3">
              <label class="text-sm text-zinc-400">Egzersizler</label>
              <button onclick="addExerciseField()" class="flex items-center gap-2 text-pink-400 hover:text-pink-300">
                <i class="fas fa-plus"></i> Egzersiz Ekle
              </button>
            </div>
            <div id="exercisesContainer" class="space-y-3 max-h-72 overflow-y-auto pr-2"></div>
          </div>
        </div>

        <div class="flex gap-4 mt-10">
          <button onclick="closeModal()" class="flex-1 py-4 rounded-2xl border border-zinc-700 hover:bg-zinc-800">İptal</button>
          <button onclick="saveWorkout()" class="flex-1 py-4 rounded-2xl bg-pink-600 hover:bg-pink-500 font-semibold">Kaydet</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let workouts = [];
    let editingId = null;

    // LocalStorage
    function loadWorkouts() {
      const saved = localStorage.getItem('fittrack_workouts');
      if (saved) {
        workouts = JSON.parse(saved);
      } else {
        workouts = [
          { id: 1, name: "Push Pull Legs", category: "Kuvvet", duration: 60, difficulty: "İleri", status: "Aktif", description: "Klasik 6 günlük split programı", exercises: [] },
          { id: 2, name: "Full Body Güç", category: "Full Body", duration: 50, difficulty: "Orta", status: "Aktif", description: "Haftada 3 gün full body", exercises: [] }
        ];
        saveWorkouts();
      }
    }

    function saveWorkouts() {
      localStorage.setItem('fittrack_workouts', JSON.stringify(workouts));
    }

    function renderSidebar() {
      document.getElementById('sidebar').innerHTML = `
        <div class="px-6 py-8 border-b border-zinc-800">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">💪</div>
            <h1 class="text-2xl font-bold text-white">FitTrack</h1>
          </div>
          <p class="text-pink-400 text-sm mt-1 pl-1">Admin Paneli</p>
        </div>

        <nav class="flex-1 px-3 py-6 space-y-1">
          <a href="admin.html" class="flex items-center gap-3 px-6 py-3 rounded-2xl text-zinc-400 hover:bg-zinc-800 transition">
            <i class="fas fa-cogs w-5"></i><span>Admin Paneli</span>
          </a>

          <div class="px-6 mt-8 mb-3">
            <span class="text-pink-400 text-xs font-semibold tracking-widest">YÖNETİM</span>
          </div>
          
          <a href="admin-stats.html" class="flex items-center gap-3 px-6 py-3 rounded-2xl text-zinc-400 hover:bg-zinc-800 transition">
            <i class="fas fa-chart-bar w-5"></i><span>İstatistikler & Raporlar</span>
          </a>

          <a href="admin-workouts.html" class="flex items-center gap-3 px-6 py-3 rounded-2xl bg-zinc-800 text-pink-400">
            <i class="fas fa-dumbbell w-5"></i><span>Antrenman Yönetimi</span>
          </a>

          <div class="px-6 mt-8 mb-3">
            <span class="text-pink-400 text-xs font-semibold tracking-widest">SİSTEM</span>
          </div>
          
          <a href="admin-settings.html" class="flex items-center gap-3 px-6 py-3 rounded-2xl text-zinc-400 hover:bg-zinc-800 transition">
            <i class="fas fa-cog w-5"></i><span>Sistem Ayarları</span>
          </a>

          <a href="admin-site.html" class="flex items-center gap-3 px-6 py-3 rounded-2xl text-zinc-400 hover:bg-zinc-800 transition">
            <i class="fas fa-globe w-5"></i><span>Site Ayarları</span>
          </a>
        </nav>

        <div class="p-6 border-t border-zinc-800 mt-auto">
          <button onclick="cikisYap()" class="w-full flex items-center justify-center gap-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 py-4 rounded-2xl transition font-medium">
            <i class="fas fa-sign-out-alt"></i><span>Çıkış Yap</span>
          </button>
        </div>
      `;
    }

    // Sıralama Fonksiyonu
    let sortDir = 1;
    function sortTable(col) {
      sortDir *= -1;
      workouts.sort((a, b) => {
        let x = col === 0 ? a.name : col === 1 ? a.category : col === 2 ? a.duration : a.difficulty;
        let y = col === 0 ? b.name : col === 1 ? b.category : col === 2 ? b.duration : b.difficulty;
        return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
      });
      renderTable();
    }

    function renderTable(data = workouts) {
      const tbody = document.getElementById('workoutTable');
      tbody.innerHTML = '';

      data.forEach(w => {
        const exCount = w.exercises ? w.exercises.length : 0;
        tbody.innerHTML += `
          <tr class="hover:bg-zinc-800/50">
            <td class="p-6 font-medium">${w.name}</td>
            <td class="p-6 text-zinc-400">${w.category}</td>
            <td class="p-6">${w.duration} dk</td>
            <td class="p-6">
              <span class="px-4 py-1 rounded-full text-sm ${w.difficulty === 'İleri' ? 'bg-red-500/20 text-red-400' : w.difficulty === 'Orta' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-emerald-500/20 text-emerald-400'}">
                ${w.difficulty}
              </span>
            </td>
            <td class="p-6 text-zinc-400">${exCount} egzersiz</td>
            <td class="p-6 text-center">
              <span class="inline-flex px-4 py-1 rounded-full text-sm ${w.status === 'Aktif' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-zinc-600 text-zinc-400'}">
                ${w.status}
              </span>
            </td>
            <td class="p-6 text-center space-x-4">
              <button onclick="editWorkout(${w.id})" class="text-blue-400 hover:text-blue-300"><i class="fas fa-edit"></i></button>
              <button onclick="deleteWorkout(${w.id})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function addExerciseField() {
      const container = document.getElementById('exercisesContainer');
      const div = document.createElement('div');
      div.className = "grid grid-cols-12 gap-3 bg-zinc-800 p-4 rounded-2xl items-center";
      div.innerHTML = `
        <input type="text" placeholder="Egzersiz adı" class="col-span-5 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
        <input type="text" placeholder="4x12" class="col-span-3 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
        <input type="number" placeholder="60" class="col-span-3 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
        <button onclick="this.parentElement.remove()" class="col-span-1 text-red-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
      `;
      container.appendChild(div);
    }

    function getExercisesFromModal() {
      const exercises = [];
      document.querySelectorAll('#exercisesContainer > div').forEach(div => {
        const inputs = div.querySelectorAll('input');
        if (inputs[0] && inputs[0].value.trim()) {
          exercises.push({
            name: inputs[0].value.trim(),
            sets: inputs[1].value.trim() || "3x10",
            rest: parseInt(inputs[2].value) || 60
          });
        }
      });
      return exercises;
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = "Yeni Antrenman Ekle";
      document.getElementById('name').value = '';
      document.getElementById('category').value = 'Kuvvet';
      document.getElementById('duration').value = '45';
      document.getElementById('difficulty').value = 'Orta';
      document.getElementById('status').value = 'Aktif';
      document.getElementById('description').value = '';
      document.getElementById('exercisesContainer').innerHTML = '';
      document.getElementById('workoutModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('workoutModal').classList.add('hidden');
    }

    function saveWorkout() {
      const name = document.getElementById('name').value.trim();
      if (!name) return alert("Antrenman adı boş olamaz!");

      const exercises = getExercisesFromModal();

      if (editingId) {
        const w = workouts.find(x => x.id === editingId);
        if (w) {
          w.name = name;
          w.category = document.getElementById('category').value;
          w.duration = parseInt(document.getElementById('duration').value) || 30;
          w.difficulty = document.getElementById('difficulty').value;
          w.status = document.getElementById('status').value;
          w.description = document.getElementById('description').value;
          w.exercises = exercises;
        }
      } else {
        workouts.push({
          id: Date.now(),
          name: name,
          category: document.getElementById('category').value,
          duration: parseInt(document.getElementById('duration').value) || 30,
          difficulty: document.getElementById('difficulty').value,
          status: document.getElementById('status').value,
          description: document.getElementById('description').value,
          exercises: exercises
        });
      }

      saveWorkouts();
      closeModal();
      renderTable();
      updateStats();
    }

    function editWorkout(id) {
      const workout = workouts.find(w => w.id === id);
      if (!workout) return;

      editingId = id;
      document.getElementById('modalTitle').textContent = "Antrenmanı Düzenle";

      document.getElementById('name').value = workout.name;
      document.getElementById('category').value = workout.category;
      document.getElementById('duration').value = workout.duration;
      document.getElementById('difficulty').value = workout.difficulty;
      document.getElementById('status').value = workout.status;
      document.getElementById('description').value = workout.description || '';

      const container = document.getElementById('exercisesContainer');
      container.innerHTML = '';

      if (workout.exercises && workout.exercises.length > 0) {
        workout.exercises.forEach(ex => {
          const div = document.createElement('div');
          div.className = "grid grid-cols-12 gap-3 bg-zinc-800 p-4 rounded-2xl items-center";
          div.innerHTML = `
            <input type="text" value="${ex.name}" class="col-span-5 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
            <input type="text" value="${ex.sets}" class="col-span-3 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
            <input type="number" value="${ex.rest}" class="col-span-3 bg-zinc-700 rounded-xl px-4 py-3 text-sm">
            <button onclick="this.parentElement.remove()" class="col-span-1 text-red-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
          `;
          container.appendChild(div);
        });
      }
      document.getElementById('workoutModal').classList.remove('hidden');
    }

    function deleteWorkout(id) {
      if (confirm("Bu antrenmanı silmek istediğinden emin misin?")) {
        workouts = workouts.filter(w => w.id !== id);
        saveWorkouts();
        renderTable();
        updateStats();
      }
    }

    function updateStats() {
      document.getElementById('total-count').textContent = workouts.length;
      const active = workouts.filter(w => w.status === "Aktif").length;
      document.getElementById('active-count').textContent = active;

      const catCount = {};
      workouts.forEach(w => catCount[w.category] = (catCount[w.category] || 0) + 1);
      const popular = Object.keys(catCount).reduce((a,b) => catCount[a] > catCount[b] ? a : b, "—");
      document.getElementById('popular-category').textContent = popular;

      const avg = workouts.length ? Math.round(workouts.reduce((s, w) => s + w.duration, 0) / workouts.length) : 0;
      document.getElementById('avg-duration').textContent = avg ? avg + " dk" : "—";
    }

    function filterTable() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;

      const filtered = workouts.filter(w => 
        w.name.toLowerCase().includes(term) && (!cat || w.category === cat)
      );
      renderTable(filtered);
    }

    function cikisYap() {
      if (confirm("Çıkış yapmak istediğinden emin misin?")) {
        localStorage.removeItem("isAdmin");
        window.location.href = "index.html";
      }
    }

    function checkAdminAccess() {
      if (localStorage.getItem("isAdmin") !== "true") {
        alert("❌ Bu sayfaya sadece Admin yetkisiyle erişebilirsiniz!");
        window.location.href = "dashboard.html";
        return false;
      }
      return true;
    }

    window.onload = () => {
      if (!checkAdminAccess()) return;
      renderSidebar();
      loadWorkouts();
      renderTable();
      updateStats();
    };
  </script>
</body>
</html>

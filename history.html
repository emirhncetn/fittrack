<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geçmiş Antrenmanlar - FitTrack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .card {
      background: #18181b;
      border: 1px solid #3f3f46;
    }
    .history-card {
      transition: all 0.3s ease;
    }
    .history-card:hover {
      transform: translateY(-5px);
      border-color: rgb(16 185 129);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- ========== DINAMIK SIDEBAR ========== -->
  <div id="sidebar" class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col fixed h-screen"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="main-content ml-72">
    <div class="max-w-7xl mx-auto px-6 py-10">
      <div class="flex justify-between items-center mb-10">
        <div>
          <h1 class="text-4xl font-bold">Geçmiş Antrenmanlar</h1>
          <p class="text-zinc-400">Tüm kayıtların burada</p>
        </div>
        <a href="add-workout.html" 
           class="bg-emerald-500 hover:bg-emerald-600 px-6 py-3 rounded-2xl flex items-center gap-3 font-medium">
          <i class="fas fa-plus"></i>
          Yeni Antrenman
        </a>
      </div>

      <!-- Filtreler -->
      <div class="flex gap-4 mb-8 flex-wrap">
        <button class="px-5 py-2 bg-emerald-500/20 text-emerald-400 rounded-2xl">Tümü</button>
        <button class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition">Bu Ay</button>
        <button class="px-5 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-2xl transition">Bu Hafta</button>
      </div>

      <!-- Antrenman Listesi -->
      <div class="space-y-6" id="historyList">
        <!-- JavaScript ile doldurulacak -->
      </div>
    </div>
  </div>

  <script>
    // ====================== DINAMIK SIDEBAR ======================
    function renderSidebar() {
      const isAdminUser = localStorage.getItem("isAdmin") === "true";
      
      const adminLink = isAdminUser ? `
        <a href="admin.html" class="nav-item mt-8 text-pink-400">
          <i class="fas fa-cogs"></i>
          <span>Admin Paneli</span>
        </a>` : '';

      document.getElementById('sidebar').innerHTML = `
        <div class="px-6 py-8">
          <div class="flex items-center gap-3 mb-10 pl-3">
            <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">💪</div>
            <h1 class="text-2xl font-bold text-white">FitTrack</h1>
          </div>
        </div>

        <nav class="space-y-1 px-3">
          <a href="dashboard.html" class="nav-item">
            <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
          </a>
          <a href="add-workout.html" class="nav-item">
            <i class="fas fa-plus-circle"></i><span>Antrenman Ekle</span>
          </a>
          <a href="history.html" class="nav-item active">
            <i class="fas fa-history"></i><span>Geçmiş</span>
          </a>
          <a href="nutrition.html" class="nav-item">
            <i class="fas fa-apple-alt"></i><span>Beslenme Takibi</span>
          </a>
          <a href="measurements.html" class="nav-item">
            <i class="fas fa-ruler-combined"></i><span>Ölçümler</span>
          </a>
          <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i><span>Profil</span>
          </a>
          ${adminLink}
        </nav>

        <div class="absolute bottom-8 w-full px-6">
          <button onclick="cikisYap()" 
                  class="w-full flex items-center justify-center gap-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 py-4 rounded-2xl transition font-medium">
            <i class="fas fa-sign-out-alt"></i>
            <span>Çıkış Yap</span>
          </button>
        </div>
      `;
    }

    // ====================== ÇIKIŞ FONKSİYONU ======================
    function cikisYap() {
      if (confirm("Çıkış yapmak istediğinden emin misin?")) {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("isAdmin");
        window.location.href = "index.html";
      }
    }

    function loadWorkouts() {
      const workouts = JSON.parse(localStorage.getItem('workouts')) || [];
      const container = document.getElementById('historyList');
      container.innerHTML = '';

      if (workouts.length === 0) {
        container.innerHTML = `
          <div class="card rounded-3xl p-12 text-center">
            <p class="text-2xl text-zinc-400">Henüz hiç antrenman eklenmedi.</p>
            <a href="add-workout.html" class="inline-block mt-6 bg-emerald-500 hover:bg-emerald-600 px-8 py-4 rounded-2xl font-semibold">
              İlk Antrenmanını Ekle
            </a>
          </div>`;
        return;
      }

      workouts.forEach(w => {
        const card = `
          <div class="history-card card border border-white/10 rounded-3xl p-7">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
              <div>
                <h3 class="text-2xl font-semibold">${w.name}</h3>
                <p class="text-zinc-400 mt-1">${new Date(w.date).toLocaleDateString('tr-TR')} • ${w.duration} dakika</p>
              </div>
              <div class="text-emerald-400 font-medium bg-emerald-500/10 px-5 py-2 rounded-2xl">
                Tamamlandı
              </div>
            </div>
          </div>`;
        container.innerHTML += card;
      });
    }

    // ====================== SAYFA YÜKLENDİĞİNDE ======================
    window.onload = () => {
      renderSidebar();
      loadWorkouts();
    };
  </script>
</body>
</html>
